services:
  api:
    build: .
    image: dr-mlops:latest
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  ui:
    image: dr-mlops:latest
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - API_URL=http://nginx:80
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    depends_on:
      - nginx
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  # Optional load tester: docker compose run --rm locust
  locust:
    image: dr-mlops:latest
    profiles: ["load"]
    command:
      [
        "locust",
        "-f",
        "locust/locustfile.py",
        "--host",
        "http://nginx:80",
        "--headless",
        "-u",
        "20",
        "-r",
        "5",
        "-t",
        "60s",
        "--csv",
        "locust_results/out",
      ]
    volumes:
      - ./locust:/app/locust
      - ./locust_results:/app/locust_results
      - ./data:/app/data
    depends_on:
      - nginx
